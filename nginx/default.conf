# Gateway nginx — mirrors the original meetyuwen.com path layout.
#
# Path map:
#   /                       -> react-frontend (Yuwen Portfolio)
#   /springapp/             -> personal-data-service (Spring Boot, 9090)
#   /api/                   -> fastapi-service (8000)
#   /api/news/              -> fastapi-service /news/ (rate limited per visitor IP)
#   /quant/                 -> streamlit-service (8501, QQQ SMA monitor)
#   /residentialcomplex/    -> vue-frontend (PMS UI, publicPath)
#   /complex/               -> pms-server (Spring Boot, 9091)  — Vue calls this
#   /notes/                 -> learning-journey-hub (only with `--profile docs`)

upstream react_frontend       { server react-frontend:80; }
upstream vue_frontend         { server vue-frontend:80; }
upstream personal_data        { server personal-data-service:9090; }
upstream pms_server           { server pms-server:9091; }
upstream fastapi_service      { server fastapi-service:8000; }
upstream streamlit_service    { server streamlit-service:8501; }

# --- Anti-scraping for the news archive (/api/news/) ---
# Limits are per visitor IP: loose enough for someone browsing /newsmonitor,
# too slow for bulk downloading. Full text (one story per request) is the
# valuable part, so it gets the tighter limit.
#   lists, overview, symbols: 30 per minute, bursts of up to 40
#   one story's full text:    10 per minute, bursts of up to 20
limit_req_zone $binary_remote_addr zone=news_list:10m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=news_story:10m rate=10r/m;

# Scripted clients that announce themselves (or send no User-Agent at all).
map $http_user_agent $news_bot_agent {
    default 0;
    ""      1;
    "~*(python-requests|python-urllib|aiohttp|httpx|scrapy|curl/|wget|go-http-client|okhttp|java/|libwww-perl|node-fetch|headlesschrome|phantomjs|selenium|playwright|puppeteer)" 1;
}

server {
    listen 80 default_server;
    server_name _;

    # The host nginx terminates HTTPS and proxies to 127.0.0.1:8080, so every
    # request arrives from the Docker bridge. Take the visitor's IP from the
    # X-Real-IP header it sets; the rate limits above key on it.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    client_max_body_size 50m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Docker's embedded DNS — needed for lazy-resolved upstreams below.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # --- Personal-Data-Service (Spring Boot) ---
    # React frontend calls https://.../springapp/<endpoint>; backend exposes /<endpoint> at root.
    location /springapp/ {
        proxy_pass http://personal_data/;
    }

    # --- News archive (FastAPI /news/*), rate limited ---
    # Over-limit requests get 429; the news page shows a "slow down" message.
    limit_req_status 429;

    # The headline list needs its own exact match: with only the
    # `/api/news/items/` prefix below, nginx would 301-redirect
    # /api/news/items to the trailing-slash form.
    location = /api/news/items {
        if ($news_bot_agent) { return 403; }
        limit_req zone=news_list burst=40 nodelay;
        proxy_pass http://fastapi_service/news/items;
    }

    location /api/news/items/ {
        if ($news_bot_agent) { return 403; }
        limit_req zone=news_story burst=20 nodelay;
        proxy_pass http://fastapi_service/news/items/;
    }

    location /api/news/ {
        if ($news_bot_agent) { return 403; }
        limit_req zone=news_list burst=40 nodelay;
        proxy_pass http://fastapi_service/news/;
    }

    # --- FastAPI (QML model serving) ---
    location /api/ {
        proxy_pass http://fastapi_service/;
        proxy_read_timeout 120s;
    }

    # --- Streamlit QQQ SMA monitor ---
    # Streamlit serves itself at base path /quant (see streamlit-service
    # Dockerfile env). Trailing slash is intentional — otherwise nginx would
    # prefix-match /quantmonitor (the React wrapper page) and proxy it here.
    # WebSocket upgrade headers are needed for Streamlit's live event stream.
    location = /quant { return 301 /quant/; }
    location /quant/ {
        proxy_pass http://streamlit_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # --- PMS server (Spring Boot, controllers mapped at /pms/...) ---
    # Vue calls https://.../complex/pms/...; strip /complex/ so /pms/... reaches backend.
    location /complex/ {
        proxy_pass http://pms_server/;
    }

    # --- Vue static site (publicPath /residentialcomplex/) ---
    location /residentialcomplex/ {
        proxy_pass http://vue_frontend;
    }

    # --- Writerside docs (only available with --profile docs) ---
    # Lazy DNS resolution: if learning-journey-hub container isn't running,
    # nginx still starts; requests to /notes/ return 502 until you bring it up.
    location /notes/ {
        set $notes_upstream learning-journey-hub:80;
        proxy_pass http://$notes_upstream;
    }

    # --- React main site (default catch-all, must be last) ---
    location / {
        proxy_pass http://react_frontend;
    }
}
